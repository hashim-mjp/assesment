# Default / shared configuration.
# Production-like durability target is PostgreSQL (see application-postgres.yml).
# Activate local H2 with: --spring.profiles.active=local
# Activate Postgres with: --spring.profiles.active=postgres
#
# Schema strategy: Flyway owns DDL (V1 ticket, V2 comment).
# Hibernate ddl-auto stays "validate" so entity mappings must match migrations.

spring:
  application:
    name: support-tickets
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
