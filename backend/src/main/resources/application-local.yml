# Local / fast-dev profile: file-based H2 (survives process restart; not in-memory).
# Activate with: --spring.profiles.active=local
# Schema: Flyway (see application.yml); Hibernate validates against migrations.

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tickets}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false

# Frontend origin(s) for LocalCorsConfig (comma-separated if multiple).
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
